<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Duck's Bitflow</title>
    <link rel="stylesheet" href="Styles/cadastro.css">
    <link rel="icon" href="Imagens/img/BitflowIcon.png">
</head>
<body>

    <!-- Barra amarela -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="Imagens/img/BitflowIcon.png" alt="Logo">
                <a href="index.html">Duck's Bitflow</a>

            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre_projetos.html">Sobre Projetos</a></li>
                <li><a href="orçamento.html">Orçamentos</a></li>
                <li><a href="clientes.html">Clientes</a></li>
            </ul>
        </nav>
    </header>

    <!-- Formulário -->
    <div class="form-container">
        <h2><span>Crie</span> sua conta </h2>
        <p>Cadastre sua conta para solicitar um <span> orçamento </span> personalizado</p>
        <form action="#" method="post">

            <div class="input-field">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="✉ Digite seu e-mail" required>
            </div>

            <div class="input-field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="🔑 Crie uma senha" required>
            </div>

            <div class="input-field">
                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" placeholder="🔑 Repita sua senha" required>
            </div>

            <button type="submit" class="btn">Cadastrar</button>
        </form>

        <p class="login-text">Já tem uma conta? <a href="login.html">Faça o login</a></p>
    </div>

</body>
</html>
