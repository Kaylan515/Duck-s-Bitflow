<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Duck's Bitflow</title>
    <link rel="stylesheet" href="Styles/login.css">
    <link rel="icon" href="Imagens/img/BitflowIcon.png">
</head>
<body>

    <!-- NAVBAR IGUAL À DO CADASTRO -->
    <header>
        <nav class="navbar">

            <div class="logo">
                <img src="Imagens/img/BitflowIcon.png" alt="Logo">
                <a href="index.html">Duck's Bitflow</a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre_projetos.html">Sobre Projetos</a></li>
                <li><a href="orçamento.html">Orçamentos</a></li>
                <li><a href="clientes.html">Clientes</a></li>
            </ul>

        </nav>
    </header>

    <div class="login-container">
        <h1>Faça o seu <span>Login</span></h1>
        <h2>Entre em sua conta para solicitar um orçamento:</h2>

        <form action="#" method="post">

            <div class="input-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="✉ Digite seu e-mail" required>
            </div>

            <div class="input-field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="🔑 Digite sua senha" required>
            </div>

            <button type="submit" class="btn">Entrar</button>
        </form>

        <p class="register-text">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>

</body>
</html>
