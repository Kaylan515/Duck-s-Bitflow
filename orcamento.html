<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento - Duck's Bitflow</title>
    <link rel="stylesheet" href="Styles/orcamento.css">
</head>
<body>
    <header>
    <nav class="navbar">

        <div class="logo">
            <img src="Imagens/img/BitflowIcon.png" alt="Logo">
            <span>Duck's Bitflow</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="sobre_projetos.html">Sobre Projetos</a></li>
            <li><a href="orcamento.html">Orçamentos</a></li>
            <li><a href="clientes.html">Clientes</a></li>
        </ul>

        <div class="botoes">
            <a href="cadastro.html" class="btn-outline">Cadastre-se</a>
            <a href="login.html" class="btn-login">Login</a>
        </div>

    </nav>
</header>

<div class="orcamento-container">
    <h1>Formulário de <span>Orçamento</span></h1>
    <p class="subtitulo">Preencha os dados abaixo e entraremos em contato</p>

    <form action="#" method="post" class="form-orcamento">

        <div class="input-field">

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@gmail.com" required>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" required>

            <label for="tipo">Tipo do Projeto</label>
            <input type="text" id="tipo" placeholder="Ex: Site institucional, E-commerce, App..." required>

            <label for="descricao">Descrição do Projeto</label>
            <textarea id="descricao" placeholder="Descreva detalhadamente seu projeto..." required></textarea>

            <button type="submit" class="btn-enviar">✈ Enviar Solicitação</button>

        </div>

    </form>
</div>

</body>
</html>
